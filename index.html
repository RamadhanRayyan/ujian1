<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-white">

    <p class="text-3xl bg-amber-300 font-bold"><marquee>Warning!</marquee></p>


<div class="min-h-screen flex flex-col justify-center items-center">
    <div class="p-10 bg-gray-100 rounded-4xl shadow-xl">
        <p class="text-5xl font-bold text-blue-950 text-center pt-7">Pengaduan Sosial</p>

    <div class="pt-12 flex flex-col">
        <label for="name" class="font-bold text-2xl pr-3">Nama Lengkap:</label>
        <input type="text" id="name" placeholder="Masukan Nama Anda" class="border-2 border-b-black pl-2 rounded-2xl">
    </div>
        <div class="pt-5 flex flex-col">
        <label for="title" class="font-bold text-2xl pr-3">Judul Pengaduan:</label>
        <input type="text" id="title" placeholder="Masukan Judul Disini" class="border-2 border-b-black pl-2 rounded-2xl">
    </div>
        <div class="pt-5 flex flex-col">
        <label for="description" class="font-bold text-2xl pr-3">Dekskripsi Pengaduan:</label>
        <input type="text" for="description" placeholder="Masukan Dekskripsi Disini" class="border-2 border-b-black pl-2 rounded-2xl">
    </div>

    <div class="text-center pt-10">
        <button class="bg-emerald-500 rounded-xl p-2 px-52 hover:bg-emerald-700"><p class="font-bold">Kirim</p></button>
    </div>


    <div class="text-center pt-12 text-6xlxl">
        <p>Pengaduan Anda Akan Diterima <br> Secara End-To-End</p>
    </div>
</div>

</div>
